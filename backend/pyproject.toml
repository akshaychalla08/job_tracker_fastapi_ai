[project]
name = "Job_tracker"
version = "0.1.0"
description = "Track my job application"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.162.0",
    "sqlalchemy[asyncio]>=2.1.8",
    "uuid6>=2025.0.1",
]


[tool.fastapi]
entrypoint = "app.main:app"
